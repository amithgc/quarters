name: Release

# Push a tag like v1.2.0 to publish a release: the Mac app (signed with a
# Developer ID and notarized by Apple), the Linux servers, and the Homebrew
# tap (amithgc/homebrew-tap) updated to it.
#
# Secrets:
#   MACOS_CERT_P12        the Developer ID Application certificate and key, exported as .p12, base64
#   MACOS_CERT_PASSWORD   the .p12's password
#   APPLE_ID              the Apple ID email used for notarizing
#   APPLE_TEAM_ID         the team id (10 characters)
#   APPLE_APP_PASSWORD    an app-specific password for that Apple ID
#   TAP_TOKEN             a token that can push to amithgc/homebrew-tap (optional: without it the tap isn't updated)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0 # same as go.mod

      - name: Signing certificate
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # A throwaway keychain for this run only.
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          test -n "$ID" || { echo "no Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          echo "MAC_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: WAILS="$(go env GOPATH)/bin/wails" scripts/package-mac.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/release/Quarters-*.zip*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the Linux servers
        run: |
          make server
          cd build/bin
          for f in quarters-linux-*; do tar -czf "$f.tar.gz" --transform "s|$f|quarters|" "$f"; done
          shasum -a 256 *.tar.gz > linux.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/bin/*.tar.gz
            build/bin/linux.sha256

  release:
    needs: [mac, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Quarters ${GITHUB_REF_NAME#v}" --generate-notes \
            dist/Quarters-*.zip dist/*.tar.gz

      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "no TAP_TOKEN: the tap isn't updated"; exit 0; fi
          V="${GITHUB_REF_NAME#v}"
          MAC_SHA="$(cat dist/Quarters-$V.zip.sha256)"
          AMD_SHA="$(grep linux-amd64 dist/linux.sha256 | cut -d' ' -f1)"
          ARM_SHA="$(grep linux-arm64 dist/linux.sha256 | cut -d' ' -f1)"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/amithgc/homebrew-tap.git" tap
          cd tap
          mkdir -p Casks Formula
          cat > Casks/quarters.rb <<EOF
          cask "quarters" do
            version "$V"
            sha256 "$MAC_SHA"

            url "https://github.com/amithgc/quarters/releases/download/v#{version}/Quarters-#{version}.zip"
            name "Quarters"
            desc "Minimalist home for terminal coding agents across many projects"
            homepage "https://quarters.amithgc.com/"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: ">= :big_sur"

            app "Quarters.app"

            zap trash: [
              "~/.config/quarters",
              "~/Library/Caches/io.github.amithgc.quarters",
              "~/Library/WebKit/io.github.amithgc.quarters",
            ]
          end
          EOF
          cat > Formula/quarters-server.rb <<EOF
          class QuartersServer < Formula
            desc "Quarters as a server: coding agents across your projects, from a browser"
            homepage "https://quarters.amithgc.com/"
            version "$V"
            license "MIT"

            on_linux do
              on_intel do
                url "https://github.com/amithgc/quarters/releases/download/v#{version}/quarters-linux-amd64.tar.gz"
                sha256 "$AMD_SHA"
              end
              on_arm do
                url "https://github.com/amithgc/quarters/releases/download/v#{version}/quarters-linux-arm64.tar.gz"
                sha256 "$ARM_SHA"
              end
            end

            depends_on :linux

            def install
              bin.install "quarters"
            end

            test do
              assert_match "set-password", shell_output("#{bin}/quarters --help")
            end
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Quarters $V"
          git push
