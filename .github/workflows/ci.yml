name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The app uses Cocoa (Dock badge, global hotkey), so it builds on macOS only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend packages
        run: make vendor

      - name: Lint
        run: make lint

      - name: Test
        run: go test -race ./...

      - name: Build the app
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0  # same as go.mod
          make build WAILS=$(go env GOPATH)/bin/wails
