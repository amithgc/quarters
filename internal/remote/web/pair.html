<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<title>Quarters · pair this device</title>
<link rel="stylesheet" href="/auth-ui/auth.css">
</head>
<body data-page="pair">
<main class="card">
  <img class="mascot" src="/mascot/excited.svg" alt="" draggable="false">
  <h1><span class="accent">◆</span> pair this device</h1>
  <p class="muted">This makes a passkey for Quarters on this device. From then on you sign in with Face ID, Touch ID or your PIN.</p>
  <label class="field">Device name
    <input id="name" type="text" maxlength="40" autocomplete="off" spellcheck="false" placeholder="e.g. My iPhone">
  </label>
  <button id="go" class="primary" type="button">Create passkey &amp; pair</button>
  <p id="msg" class="msg" role="status"></p>
  <p class="foot muted">The pairing link works once, for 10 minutes.</p>
</main>
<script type="module" src="/auth-ui/auth.js"></script>
</body>
</html>
