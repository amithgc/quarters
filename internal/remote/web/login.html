<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<title>Quarters · sign in</title>
<link rel="stylesheet" href="/auth-ui/auth.css">
</head>
<body data-page="login">
<main class="card">
  <img class="mascot" src="/mascot/happy.svg" alt="" draggable="false">
  <h1><span class="accent">◆</span> Quarters</h1>
  <p class="muted">Your Claude Code sessions, from anywhere.</p>
  <button id="go" class="primary" type="button">Sign in with passkey</button>
  <form id="pw" class="pw hidden" autocomplete="on">
    <div id="or" class="or muted hidden">or</div>
    <label class="field">Username
      <input id="user" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    </label>
    <label class="field">Password
      <input id="pass" name="password" type="password" autocomplete="current-password" required>
    </label>
    <button id="pw-go" class="primary" type="submit">Sign in</button>
  </form>
  <p id="msg" class="msg" role="status"></p>
  <p id="foot" class="foot muted">Face ID, Touch ID or your device PIN unlocks your passkey.<br>New device? Pair it from the Mac: <b>Remote Access → Pair a device</b>.</p>
</main>
<script type="module" src="/auth-ui/auth.js"></script>
</body>
</html>
