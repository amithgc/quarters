<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -20 132 160" role="img" aria-label="Quarters mascot, sleepy">
<style>
* { transform-box: view-box; }
.move, .squash { transform-origin: 60px 128px; }
.head { transform-origin: 60px 80px; }
.ant { transform-origin: 60px 24px; }
.arm-l { transform-origin: 36.5px 85px; transform: rotate(8deg); }
.arm-r { transform-origin: 83.5px 85px; transform: rotate(-8deg); }
.blink { transform-origin: 60px 50px; animation: blink 6.3s infinite; }
@keyframes blink {
0%, 41%, 45%, 86%, 89%, 92%, 100% { transform: scaleY(1); }
43% { transform: scaleY(.08); } 87.5%, 90.5% { transform: scaleY(.08); } }
.squash { animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.99, 1.022); } }
.shadow { fill: #000; opacity: .2; transform-origin: 60px 133px; }
.ball { animation: glow 2.6s ease-in-out infinite; } @keyframes glow { 50% { opacity: .55; } }
@media (prefers-color-scheme: light) { .shadow { opacity: .13; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.squash { animation: sleep-breathe 4.4s ease-in-out infinite; }
@keyframes sleep-breathe { 0%, 100% { transform: scale(1, 1); } 45% { transform: scale(.985, 1.03); } }
.head { animation: nod 7s infinite; }
@keyframes nod {
0% { transform: rotate(4deg) translateY(0); animation-timing-function: ease-in; }
62% { transform: rotate(15deg) translateY(2.5px); } 66% { transform: rotate(17deg) translateY(3px); animation-timing-function: cubic-bezier(.2,1.6,.4,1); }
70% { transform: rotate(-4deg) translateY(-1.5px); } 76% { transform: rotate(2deg) translateY(0); }
84%, 100% { transform: rotate(4deg) translateY(0); } }
.ant { animation: nod-ant 7s infinite; }
@keyframes nod-ant { 0% { transform: rotate(4deg); } 64% { transform: rotate(14deg); } 68.0% { transform: rotate(-18.0deg); } 71.6% { transform: rotate(12.6deg); } 75.2% { transform: rotate(-8.1deg); } 78.8% { transform: rotate(4.5deg); } 82.4% { transform: rotate(-2.2deg); } 86.0% { transform: rotate(0.0deg); } 100% { transform: rotate(4deg); } }
.arm-l { animation: dangle-l 7s infinite; } .arm-r { animation: dangle-r 7s infinite; }
@keyframes dangle-l { 0%, 64% { transform: rotate(4deg); } 70% { transform: rotate(18deg); } 76% { transform: rotate(-2deg); } 82% { transform: rotate(7deg); } 90%, 100% { transform: rotate(4deg); } }
@keyframes dangle-r { 0%, 64% { transform: rotate(-4deg); } 70% { transform: rotate(-16deg); } 76% { transform: rotate(3deg); } 82% { transform: rotate(-6deg); } 90%, 100% { transform: rotate(-4deg); } }
.shut { animation: shut 7s infinite; } .woke { opacity: 0; animation: woke 7s infinite; }
@keyframes shut { 0%, 68%, 81%, 100% { opacity: 1; } 69%, 80% { opacity: 0; } }
@keyframes woke { 0%, 68%, 81%, 100% { opacity: 0; } 69%, 80% { opacity: 1; } }
.snore { animation: snore 4.4s ease-in-out infinite; } @keyframes snore { 45% { transform: scale(1.35); } }
.snore { transform-origin: 60px 61px; }
.screen { animation: dim 4.4s ease-in-out infinite; } @keyframes dim { 45% { opacity: .7; } }
.zz { opacity: 0; animation: float 4.2s ease-out infinite; } .z2 { animation-delay: 1.4s; } .z3 { animation-delay: 2.8s; }
@keyframes float {
0% { opacity: 0; transform: translate(-6px, 8px) scale(.5) rotate(-10deg); } 20% { opacity: 1; }
50% { transform: translate(-1px, 0) scale(.9) rotate(6deg); } 75% { opacity: .9; }
100% { opacity: 0; transform: translate(3px, -7px) scale(1.1) rotate(-6deg); } }</style>
<ellipse class="shadow" cx="60" cy="133" rx="28" ry="4"/>
<g class="move"><g class="squash">
<rect x="47" y="110" width="9" height="14" rx="3" fill="#C9653F"/><rect x="64" y="110" width="9" height="14" rx="3" fill="#C9653F"/>
<rect x="43" y="121" width="16" height="7" rx="3.5" fill="#9B86E0"/><rect x="61" y="121" width="16" height="7" rx="3.5" fill="#9B86E0"/>
<rect x="38" y="80" width="44" height="34" rx="12" fill="#E8825F"/>
<rect x="49" y="91" width="22" height="11" rx="4" fill="#C9653F" opacity=".45"/>
<circle cx="55" cy="96.5" r="2" fill="#F4EADD"/><circle cx="65" cy="96.5" r="2" fill="#9B86E0"/>
<rect x="54" y="75" width="12" height="7" rx="2" fill="#C9653F"/>
<g class="head">
<g class="ant"><path d="M60 24 V12" stroke="#C9653F" stroke-width="3" stroke-linecap="round"/><circle class="ball" cx="60" cy="10" r="5" fill="#FF9B7A"/></g>
<rect x="14.5" y="40" width="7" height="18" rx="3.5" fill="#9B86E0"/><rect x="98.5" y="40" width="7" height="18" rx="3.5" fill="#9B86E0"/>
<rect x="20" y="22" width="80" height="58" rx="14" fill="#F4EADD" stroke="#DCCBB6" stroke-width="2"/>
<rect class="screen" x="29" y="30" width="62" height="42" rx="9" fill="#221C29"/>
<g class="shut"><path d="M45 51 q5 3.5 10 0" fill="none" stroke="#FFB59A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 51 q5 3.5 10 0" fill="none" stroke="#FFB59A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="woke"><circle cx="51" cy="50" r="3.6" fill="#FFB59A"/><circle cx="69" cy="50" r="3.6" fill="#FFB59A"/></g>
<circle class="snore" cx="60" cy="61" r="2.2" fill="none" stroke="#FFB59A" stroke-width="2"/>
</g>
<g class="arm-l"><rect x="32" y="82" width="9" height="22" rx="4.5" fill="#E8825F"/><circle cx="36.5" cy="106" r="5.5" fill="#F4EADD"/></g>
<g class="arm-r"><rect x="79" y="82" width="9" height="22" rx="4.5" fill="#E8825F"/><circle cx="83.5" cy="106" r="5.5" fill="#F4EADD"/></g>
</g></g>
<path class="zz z1" d="M97 22 h7 l-7 8.049999999999999 h7" fill="none" stroke="#9B86E0" stroke-width="2.1875" stroke-linecap="round" stroke-linejoin="round"/><path class="zz z2" d="M104 12 h5.5 l-5.5 6.324999999999999 h5.5" fill="none" stroke="#9B86E0" stroke-width="1.71875" stroke-linecap="round" stroke-linejoin="round"/><path class="zz z3" d="M110 3 h4.5 l-4.5 5.175 h4.5" fill="none" stroke="#9B86E0" stroke-width="1.40625" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
