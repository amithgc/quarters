<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -20 132 160" role="img" aria-label="Quarters mascot, sad">
<style>
* { transform-box: view-box; }
.move, .squash { transform-origin: 60px 128px; }
.head { transform-origin: 60px 80px; }
.ant { transform-origin: 60px 24px; }
.arm-l { transform-origin: 36.5px 85px; transform: rotate(8deg); }
.arm-r { transform-origin: 83.5px 85px; transform: rotate(-8deg); }
.blink { transform-origin: 60px 50px; animation: blink 6.3s infinite; }
@keyframes blink {
0%, 41%, 45%, 86%, 89%, 92%, 100% { transform: scaleY(1); }
43% { transform: scaleY(.08); } 87.5%, 90.5% { transform: scaleY(.08); } }
.squash { animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.99, 1.022); } }
.shadow { fill: #000; opacity: .2; transform-origin: 60px 133px; }
.ball { animation: glow 2.6s ease-in-out infinite; } @keyframes glow { 50% { opacity: .55; } }
@media (prefers-color-scheme: light) { .shadow { opacity: .13; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.squash { animation: sigh 7.5s infinite; }
@keyframes sigh {
0% { transform: scale(1, 1); animation-timing-function: ease-in-out; } 28% { transform: scale(.985, 1.035); }
40% { transform: scale(.985, 1.035); animation-timing-function: cubic-bezier(.6,0,.85,.35); }
62% { transform: scale(1.025, .955); animation-timing-function: ease-in-out; } 100% { transform: scale(1, 1); } }
.head { animation: sigh-head 7.5s infinite; }
@keyframes sigh-head {
0% { transform: translateY(2px) rotate(-3deg); animation-timing-function: ease-in-out; } 30%, 40% { transform: translateY(0) rotate(-1deg); }
64% { transform: translateY(4.5px) rotate(-6deg); animation-timing-function: ease-in-out; } 100% { transform: translateY(2px) rotate(-3deg); } }
.ant { animation: droop 7.5s ease-in-out infinite; }
@keyframes droop { 0%, 100% { transform: rotate(12deg); } 35% { transform: rotate(6deg); } 66% { transform: rotate(18deg); } 74% { transform: rotate(14deg); } }
.arm-l { animation: hang-l 7.5s ease-in-out infinite; } .arm-r { animation: hang-r 7.5s ease-in-out infinite; }
@keyframes hang-l { 0%, 100% { transform: rotate(-3deg); } 35% { transform: rotate(4deg); } 64% { transform: rotate(-6deg); } 72% { transform: rotate(-2deg); } }
@keyframes hang-r { 0%, 100% { transform: rotate(3deg); } 35% { transform: rotate(-4deg); } 64% { transform: rotate(6deg); } 72% { transform: rotate(2deg); } }
.look { animation: downcast 7.5s ease-in-out infinite; }
@keyframes downcast { 0%, 22%, 54%, 100% { transform: translate(0, 1.6px); } 30%, 46% { transform: translate(.5px, -1px); } }
.tear { opacity: 0; animation: tear 7.5s infinite; transform-origin: 50px 58px; }
@keyframes tear {
0%, 44% { opacity: 0; transform: translateY(-2px) scale(.2); } 50% { opacity: 1; transform: translateY(0) scale(1); animation-timing-function: cubic-bezier(.6,0,.85,.35); }
68% { opacity: 1; transform: translateY(9px) scale(.9); } 72%, 100% { opacity: 0; transform: translateY(11px) scale(.6); } }</style>
<ellipse class="shadow" cx="60" cy="133" rx="28" ry="4"/>
<g class="move"><g class="squash">
<rect x="47" y="110" width="9" height="14" rx="3" fill="#C9653F"/><rect x="64" y="110" width="9" height="14" rx="3" fill="#C9653F"/>
<rect x="43" y="121" width="16" height="7" rx="3.5" fill="#9B86E0"/><rect x="61" y="121" width="16" height="7" rx="3.5" fill="#9B86E0"/>
<rect x="38" y="80" width="44" height="34" rx="12" fill="#E8825F"/>
<rect x="49" y="91" width="22" height="11" rx="4" fill="#C9653F" opacity=".45"/>
<circle cx="55" cy="96.5" r="2" fill="#F4EADD"/><circle cx="65" cy="96.5" r="2" fill="#9B86E0"/>
<rect x="54" y="75" width="12" height="7" rx="2" fill="#C9653F"/>
<g class="head">
<g class="ant"><path d="M60 24 V12" stroke="#C9653F" stroke-width="3" stroke-linecap="round"/><circle class="ball" cx="60" cy="10" r="5" fill="#FF9B7A"/></g>
<rect x="14.5" y="40" width="7" height="18" rx="3.5" fill="#9B86E0"/><rect x="98.5" y="40" width="7" height="18" rx="3.5" fill="#9B86E0"/>
<rect x="20" y="22" width="80" height="58" rx="14" fill="#F4EADD" stroke="#DCCBB6" stroke-width="2"/>
<rect class="screen" x="29" y="30" width="62" height="42" rx="9" fill="#2A2233"/>
<g class="look"><g class="blink"><circle cx="51" cy="51" r="3.8" fill="#FFB59A"/><circle cx="69" cy="51" r="3.8" fill="#FFB59A"/></g></g><path d="M45 45 L55 41.5" fill="none" stroke="#FFB59A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M75 45 L65 41.5" fill="none" stroke="#FFB59A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<g class="mouth"><path d="M51 63 q9 -7 18 0" fill="none" stroke="#FFB59A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><path class="tear" d="M50 55 q-2.4 3.6 0 5 q2.4 -1.4 0 -5z" fill="#8EC9F0"/>
</g>
<g class="arm-l"><rect x="32" y="82" width="9" height="22" rx="4.5" fill="#E8825F"/><circle cx="36.5" cy="106" r="5.5" fill="#F4EADD"/></g>
<g class="arm-r"><rect x="79" y="82" width="9" height="22" rx="4.5" fill="#E8825F"/><circle cx="83.5" cy="106" r="5.5" fill="#F4EADD"/></g>
</g></g>
</svg>
