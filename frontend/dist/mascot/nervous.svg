<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -20 132 160" role="img" aria-label="Quarters mascot, nervous">
<style>
* { transform-box: view-box; }
.move, .squash { transform-origin: 60px 128px; }
.head { transform-origin: 60px 80px; }
.ant { transform-origin: 60px 24px; }
.arm-l { transform-origin: 36.5px 85px; transform: rotate(8deg); }
.arm-r { transform-origin: 83.5px 85px; transform: rotate(-8deg); }
.blink { transform-origin: 60px 50px; animation: blink 6.3s infinite; }
@keyframes blink {
0%, 41%, 45%, 86%, 89%, 92%, 100% { transform: scaleY(1); }
43% { transform: scaleY(.08); } 87.5%, 90.5% { transform: scaleY(.08); } }
.squash { animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.99, 1.022); } }
.shadow { fill: #000; opacity: .2; transform-origin: 60px 133px; }
.ball { animation: glow 2.6s ease-in-out infinite; } @keyframes glow { 50% { opacity: .55; } }
@media (prefers-color-scheme: light) { .shadow { opacity: .13; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.move { animation: jitter .42s linear infinite; }
@keyframes jitter {
0% { transform: translate(0, 0) rotate(0); } 13% { transform: translate(.6px, -.2px) rotate(.4deg); }
29% { transform: translate(-.4px, .2px) rotate(-.3deg); } 41% { transform: translate(.7px, 0) rotate(.2deg); }
58% { transform: translate(-.6px, -.3px) rotate(-.5deg); } 72% { transform: translate(.3px, .2px) rotate(.3deg); }
86% { transform: translate(-.7px, 0) rotate(-.2deg); } 100% { transform: translate(0, 0) rotate(0); } }
.squash { animation: pant 1.3s ease-in-out infinite; } @keyframes pant { 50% { transform: scale(.99, 1.02); } }
.head { animation: glance-head 2.6s infinite; }
@keyframes glance-head { 0%, 30% { transform: rotate(-3deg); } 36%, 62% { transform: rotate(3deg); } 68%, 100% { transform: rotate(-3deg); } }
.ant { animation: buzz .16s linear infinite; } @keyframes buzz { 50% { transform: rotate(4deg); } }
.arm-l { animation: wring-l .55s ease-in-out infinite; } .arm-r { animation: wring-r .55s ease-in-out infinite; }
@keyframes wring-l { 0%, 100% { transform: rotate(-26deg); } 50% { transform: rotate(-16deg); } }
@keyframes wring-r { 0%, 100% { transform: rotate(16deg); } 50% { transform: rotate(26deg); } }
.pupils { animation: dart 2.6s infinite; }
@keyframes dart {
0%, 14% { transform: translate(-2.2px, 0); } 17%, 30% { transform: translate(1.8px, .3px); } 33%, 42% { transform: translate(-1px, -.6px); }
45%, 62% { transform: translate(2.3px, 0); } 65%, 82% { transform: translate(-2px, .4px); } 85%, 100% { transform: translate(-2.2px, 0); } }
.mouth { animation: quiver .3s steps(2) infinite; } @keyframes quiver { 50% { transform: translateX(.6px); } }
.sweat { opacity: 0; animation: sweat 2.8s infinite; transform-origin: 15px 34px; } .s2 { animation-delay: 1.5s; transform-origin: 104px 37px; }
@keyframes sweat {
0% { opacity: 0; transform: translateY(0) scale(.2); } 18% { opacity: 1; transform: translateY(0) scale(1); animation-timing-function: cubic-bezier(.6,0,.85,.35); }
70% { opacity: 1; transform: translateY(12px) scale(.95); } 80%, 100% { opacity: 0; transform: translateY(16px) scale(.7); } }</style>
<ellipse class="shadow" cx="60" cy="133" rx="28" ry="4"/>
<g class="move"><g class="squash">
<rect x="47" y="110" width="9" height="14" rx="3" fill="#C9653F"/><rect x="64" y="110" width="9" height="14" rx="3" fill="#C9653F"/>
<rect x="43" y="121" width="16" height="7" rx="3.5" fill="#9B86E0"/><rect x="61" y="121" width="16" height="7" rx="3.5" fill="#9B86E0"/>
<rect x="38" y="80" width="44" height="34" rx="12" fill="#E8825F"/>
<rect x="49" y="91" width="22" height="11" rx="4" fill="#C9653F" opacity=".45"/>
<circle cx="55" cy="96.5" r="2" fill="#F4EADD"/><circle cx="65" cy="96.5" r="2" fill="#9B86E0"/>
<rect x="54" y="75" width="12" height="7" rx="2" fill="#C9653F"/>
<g class="head">
<g class="ant"><path d="M60 24 V12" stroke="#C9653F" stroke-width="3" stroke-linecap="round"/><circle class="ball" cx="60" cy="10" r="5" fill="#FF9B7A"/></g>
<rect x="14.5" y="40" width="7" height="18" rx="3.5" fill="#9B86E0"/><rect x="98.5" y="40" width="7" height="18" rx="3.5" fill="#9B86E0"/>
<rect x="20" y="22" width="80" height="58" rx="14" fill="#F4EADD" stroke="#DCCBB6" stroke-width="2"/>
<rect class="screen" x="29" y="30" width="62" height="42" rx="9" fill="#2A2233"/>
<g class="look"><g class="blink"><circle cx="51" cy="50" r="4.8" fill="#FFB59A"/><circle cx="69" cy="50" r="4.8" fill="#FFB59A"/><g class="pupils"><circle cx="52" cy="50.5" r="1.9" fill="#2A2233"/><circle cx="70" cy="50.5" r="1.9" fill="#2A2233"/></g></g></g>
<path d="M45 42 q5 -3 10 0" fill="none" stroke="#FFB59A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 42 q5 -3 10 0" fill="none" stroke="#FFB59A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g class="mouth"><path d="M48 62 q2.75 -3 5.5 0 t5.5 0 t5.5 0 t5.5 0" fill="none" stroke="#FFB59A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g class="arm-l"><rect x="32" y="82" width="9" height="22" rx="4.5" fill="#E8825F"/><circle cx="36.5" cy="106" r="5.5" fill="#F4EADD"/></g>
<g class="arm-r"><rect x="79" y="82" width="9" height="22" rx="4.5" fill="#E8825F"/><circle cx="83.5" cy="106" r="5.5" fill="#F4EADD"/></g>
</g></g>
<path class="sweat" d="M15 30 q-4.5 6.5 0 9 q4.5 -2.5 0 -9z" fill="#8EC9F0"/><path class="sweat s2" d="M104 34 q-3.4 5 0 7 q3.4 -2 0 -7z" fill="#8EC9F0"/>
</svg>
