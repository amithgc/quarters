<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -20 132 160" role="img" aria-label="Quarters mascot, thinking">
<style>
* { transform-box: view-box; }
.move, .squash { transform-origin: 60px 128px; }
.head { transform-origin: 60px 80px; }
.ant { transform-origin: 60px 24px; }
.arm-l { transform-origin: 36.5px 85px; transform: rotate(8deg); }
.arm-r { transform-origin: 83.5px 85px; transform: rotate(-8deg); }
.blink { transform-origin: 60px 50px; animation: blink 6.3s infinite; }
@keyframes blink {
0%, 41%, 45%, 86%, 89%, 92%, 100% { transform: scaleY(1); }
43% { transform: scaleY(.08); } 87.5%, 90.5% { transform: scaleY(.08); } }
.squash { animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.99, 1.022); } }
.shadow { fill: #000; opacity: .2; transform-origin: 60px 133px; }
.ball { animation: glow 2.6s ease-in-out infinite; } @keyframes glow { 50% { opacity: .55; } }
@media (prefers-color-scheme: light) { .shadow { opacity: .13; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.move { animation: sway 6.4s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.8deg); } }
.squash { animation: breathe 3.1s ease-in-out infinite; }
.head { animation: ponder 6.4s ease-in-out infinite; }
@keyframes ponder { 0%, 100% { transform: rotate(-4deg); } 45%, 60% { transform: rotate(5deg); } }
.ant { animation: ponder-ant 6.4s ease-in-out infinite; }
@keyframes ponder-ant { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(-6deg); } }
.ball { animation: compute 1.1s steps(2) infinite; }
@keyframes compute { 50% { opacity: .45; } }
.arm-r { animation: tap 6.4s infinite; }
@keyframes tap {
0%, 6%, 11%, 16%, 21%, 100% { transform: rotate(138deg); animation-timing-function: cubic-bezier(.2,.75,.35,1); }
8.5%, 13.5%, 18.5% { transform: rotate(147deg); animation-timing-function: cubic-bezier(.6,0,.85,.35); }
55%, 62%, 67% { transform: rotate(138deg); } 58.5%, 64.5% { transform: rotate(147deg); } }
.look { animation: dart 6.4s infinite; }
@keyframes dart {
0%, 27% { transform: translate(-2.6px, -2.2px); } 30%, 54% { transform: translate(2.8px, -2.4px); }
57%, 74% { transform: translate(.4px, .3px); } 77%, 100% { transform: translate(-2.6px, -2.2px); } }
.mouth { animation: chew 6.4s infinite; }
@keyframes chew { 0%, 27% { transform: translateX(-1.2px); } 31%, 54% { transform: translateX(1.4px); } 58%, 74% { transform: translateX(0) scaleX(.7); } 78%, 100% { transform: translateX(-1.2px); } }
.d { opacity: 0; animation: rise 2.4s cubic-bezier(.2,.75,.35,1) infinite; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .7s; }
@keyframes rise { 0% { opacity: 0; transform: translateY(5px) scale(.4); } 25%, 60% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-3px) scale(1.1); } }</style>
<ellipse class="shadow" cx="60" cy="133" rx="28" ry="4"/>
<g class="move"><g class="squash">
<rect x="47" y="110" width="9" height="14" rx="3" fill="#C9653F"/><rect x="64" y="110" width="9" height="14" rx="3" fill="#C9653F"/>
<rect x="43" y="121" width="16" height="7" rx="3.5" fill="#9B86E0"/><rect x="61" y="121" width="16" height="7" rx="3.5" fill="#9B86E0"/>
<rect x="38" y="80" width="44" height="34" rx="12" fill="#E8825F"/>
<rect x="49" y="91" width="22" height="11" rx="4" fill="#C9653F" opacity=".45"/>
<circle cx="55" cy="96.5" r="2" fill="#F4EADD"/><circle cx="65" cy="96.5" r="2" fill="#9B86E0"/>
<rect x="54" y="75" width="12" height="7" rx="2" fill="#C9653F"/>
<g class="head">
<g class="ant"><path d="M60 24 V12" stroke="#C9653F" stroke-width="3" stroke-linecap="round"/><circle class="ball" cx="60" cy="10" r="5" fill="#FF9B7A"/></g>
<rect x="14.5" y="40" width="7" height="18" rx="3.5" fill="#9B86E0"/><rect x="98.5" y="40" width="7" height="18" rx="3.5" fill="#9B86E0"/>
<rect x="20" y="22" width="80" height="58" rx="14" fill="#F4EADD" stroke="#DCCBB6" stroke-width="2"/>
<rect class="screen" x="29" y="30" width="62" height="42" rx="9" fill="#2A2233"/>
<g class="look"><g class="blink"><circle cx="51" cy="47" r="4.2" fill="#FFB59A"/><circle cx="69" cy="47" r="4.2" fill="#FFB59A"/></g></g><g class="mouth"><path d="M55 60 h10" fill="none" stroke="#FFB59A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g class="arm-l"><rect x="32" y="82" width="9" height="22" rx="4.5" fill="#E8825F"/><circle cx="36.5" cy="106" r="5.5" fill="#F4EADD"/></g>
<g class="arm-r"><rect x="79" y="82" width="9" height="22" rx="4.5" fill="#E8825F"/><circle cx="83.5" cy="106" r="5.5" fill="#F4EADD"/></g>
</g></g>
<circle class="d d1" cx="101" cy="19" r="2" fill="#9B86E0"/><circle class="d d2" cx="107" cy="12" r="2.8" fill="#9B86E0"/><circle class="d d3" cx="114" cy="4.5" r="3.6" fill="#9B86E0"/>
</svg>
